<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drip House</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--pan:#121a2b;--pan2:#18233a;--ink:#e8edf7;--mute:#8a97b1;--line:#243049;--acc:#3b82f6;--c1:#3b82f6;--c2:#ef4444;--c3:#f59e0b;--c4:#22c55e;--c5:#22d3ee;--r:10px}
[data-theme=light]{--bg:#f1f4f9;--pan:#fff;--pan2:#f3f5fa;--ink:#0f172a;--mute:#5b6678;--line:#dfe4ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.main{min-width:0}
aside{background:var(--pan);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;padding:0 6px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--c5),var(--c1));display:grid;place-items:center;color:#fff}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mute);font:500 14px Inter,sans-serif;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap}
nav button:hover{background:var(--pan2)}nav button[aria-current=page]{background:var(--acc);color:#fff}
.pill{margin-left:auto;background:var(--c2);color:#fff;border-radius:10px;font-size:11px;padding:0 7px}
header{display:flex;gap:10px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--pan)}.sp{flex:1}
header input{width:min(340px,100%)}
main{padding:20px 22px;max-width:1500px}h1.pt{font-size:20px;margin:0 0 16px}
input,select,textarea,button.b{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--pan2);color:var(--ink)}
button.b{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;cursor:pointer}button.b.ghost{background:none;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--c5);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.kpi small{color:var(--mute);display:block}.kpi b{font-size:20px}.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.two{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px}
.pan{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}.pan h3{margin:0 0 10px;font-size:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.ph h3{margin:0}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}td:first-child{white-space:normal;min-width:150px}th{color:var(--mute);font-weight:500;font-size:12px}
.num{font-variant-numeric:tabular-nums}.low{color:var(--c2);font-weight:600}
.lvl{display:inline-block;width:64px;height:8px;background:var(--pan2);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px}.lvl i{display:block;height:100%}
.fd{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.fd small{display:block;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.dot.sale{background:var(--c4)}.dot.repair{background:var(--c3)}
.leg{display:flex;gap:14px;color:var(--mute);font-size:12px;margin-bottom:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.ch{width:100%;height:auto}.ch text{fill:var(--mute);font-size:11px}.gl{stroke:var(--line)}
form{display:grid;gap:8px}label{font-size:12px;color:var(--mute);display:grid;gap:3px}.row{display:flex;gap:8px;align-items:center}
.board{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--pan2);border-radius:var(--r);padding:8px;min-height:240px}.col h3{font-size:13px;margin:2px 4px 8px;display:flex;justify-content:space-between}
.tk{background:var(--pan);border:1px solid var(--line);border-left:4px solid var(--c3);border-radius:8px;padding:9px;margin-bottom:8px}.col[data-s=completed] .tk{border-left-color:var(--c4)}
.tk small{color:var(--mute);display:block}.tk select{width:100%;margin-top:6px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}#toast.err{background:var(--c2);color:#fff}
body.login aside,body.login header{display:none}body.login .app{grid-template-columns:1fr}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:var(--pan);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px;font:500 13px Inter,sans-serif;cursor:pointer}.chip small{color:var(--mute);margin-left:4px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}.chip[aria-pressed=true] small{color:#fff;opacity:.8}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pc{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pi{aspect-ratio:1/1;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--col,var(--c1)) 26%,var(--pan2)),var(--pan2) 72%);display:grid;place-items:center;position:relative;overflow:hidden}.pi[hidden]{display:none}
.art{width:50%;height:auto;max-height:80%}.art .k{fill:var(--col)}.art .d{fill:color-mix(in srgb,var(--col) 66%,#000)}.art .l{fill:color-mix(in srgb,var(--col) 50%,#fff)}.so .art{opacity:.45;filter:grayscale(1)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 8px;border:1px solid var(--line)}
.bar{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.bar .chips{margin:0}
.empty{max-width:460px;margin:8vh auto 0;text-align:center;display:grid;gap:10px;justify-items:center}.empty p{margin:0;color:var(--mute)}
.note{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.note span{color:var(--mute)}
.pvart{width:132px;border-radius:10px;border:1px solid var(--line);margin:0 auto}
.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.so .pi img{filter:grayscale(1);opacity:.55}
.bd{position:absolute;top:10px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:12px;color:#fff}.bd.new{left:10px;background:var(--acc)}.bd.out,.bd.low{right:10px}.bd.out{background:var(--c2)}.bd.low{background:var(--c3);color:#111}
.pb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.pb small{color:var(--mute)}
.pn{font-weight:600;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pp{font-size:17px;font-weight:700;margin:2px 0 8px}.pb .row{margin-top:auto}
.cartbar{position:fixed;right:22px;bottom:16px;display:flex;gap:14px;align-items:center;background:var(--pan);border:1px solid var(--acc);border-radius:12px;padding:10px 12px 10px 16px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:20}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:50}.md{width:min(460px,100%);max-height:92vh;overflow:auto}
.pv{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--pan2)}.pv[hidden]{display:none}
.lg-card{max-width:340px;margin:12vh auto 0}.lg-card input{font-size:16px}.lg-card h2{font-size:16px;margin:0 0 4px}.lg-card p{margin:0 0 10px;color:var(--mute);font-size:13px}
.pw{position:relative;display:grid}.pw input{padding-right:64px}.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);font:500 12px Inter,sans-serif;padding:6px 8px;cursor:pointer;border-radius:6px}.pw button:hover{color:var(--ink)}
.opts{display:flex;justify-content:space-between;align-items:center;gap:8px}.opts label{display:flex;flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:13px}
.link{background:none;border:0;padding:4px 0;color:var(--acc);font:500 13px Inter,sans-serif;cursor:pointer}.link:hover{text-decoration:underline}
.sr{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.key{font:600 18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;background:var(--pan2);border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;user-select:all}
@media(max-width:600px){.shop{grid-template-columns:repeat(2,1fr);gap:10px}.pb{padding:10px}.pb .row{flex-wrap:wrap}.pb .row .b{flex:1 1 100%}.pp{font-size:15px}.cartbar{left:12px;right:12px;justify-content:space-between}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{flex-direction:row;align-items:center;overflow-x:auto;padding:8px}nav{flex-direction:row}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}

body.login{--bg:#0b1220;--pan:#121a2b;--pan2:#18233a;--ink:#e8edf7;--mute:#8a97b1;--line:#243049;color-scheme:dark;background:#02040a var(--lg-art) center/cover no-repeat fixed}
body.login #view{min-height:100vh;max-width:none;display:grid;place-items:center;padding:90px 18px 24px}
.lg-card{width:min(460px,100%);max-width:460px;margin:0;padding:0 24px 24px;background:rgba(4,9,20,.74);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(47,123,255,.6);border-radius:22px;box-shadow:0 0 0 1px rgba(59,130,246,.08) inset,0 0 38px rgba(37,99,235,.35),0 24px 70px rgba(0,0,0,.65);position:relative;display:grid;gap:12px}
.lg-logo{display:block;width:120px;height:124px;margin:-84px auto -8px;background:var(--lg-logo) center/contain no-repeat;filter:drop-shadow(0 0 14px rgba(47,123,255,.55))}
.lg-title{text-align:center;font-size:38px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}.lg-title span{color:#2f7bff}
.lg-card form{display:grid;gap:14px}.lg-card label{font-size:14px;color:#9aa6bf}
.lg-card input:not([type=checkbox]){height:50px;padding:0 14px;font-size:16px;background:rgba(9,15,30,.9);border:1px solid #26324b;border-radius:12px}
.lg-card input:focus{outline:none;border-color:#2f7bff;box-shadow:0 0 0 3px rgba(47,123,255,.25)}
.lg-card input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:#2f7bff}
.lg-card .pw button{color:#8fa0c0;font-size:14px}.lg-card .link{color:#2f7bff;font-size:14px}.lg-card .opts label{font-size:15px;color:#e8edf7}
.lg-card button.b{height:50px;font-size:17px;font-weight:700;border-radius:12px;background:linear-gradient(180deg,#2e82ff,#1c63e6);border-color:#2f7bff;box-shadow:0 6px 22px rgba(37,99,235,.45)}
.lg-card button.b.ghost{background:none;box-shadow:none;border-color:#26324b;height:44px;font-size:15px}
.lg-card h2{color:#fff}.lg-card .key{background:rgba(9,15,30,.9)}
@media(max-aspect-ratio:1/1){body.login{background:#02040a}
body.login::before,body.login::after{content:"";position:fixed;left:0;right:0;height:42vw;background-image:var(--lg-art);background-repeat:no-repeat;background-size:130% auto;pointer-events:none}
body.login::before{top:0;background-position:50% 0;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
body.login::after{bottom:0;background-position:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
body.login .app{position:relative;z-index:1}}

.bd.new{left:auto;right:10px;width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%;background:#2563eb;font-size:13px}.bd.out,.bd.low{right:auto;left:10px}
.sec{font-size:20px;margin:0 0 12px}.empty{margin:20px auto 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:26px}
.tile{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;container-type:inline-size;background:radial-gradient(120% 95% at 50% 18%,#2f6bff 0%,#1b3fc4 42%,#0a1a60 100%);border:1px solid rgba(47,123,255,.45)}
.tile.on{box-shadow:0 0 0 3px var(--acc)}
.tl-main{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;color:#fff;cursor:pointer;display:block}.tl-main:focus-visible{outline:3px solid #fff;outline-offset:-4px}
.tl-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tart{position:absolute;left:0;top:4%;width:100%;height:auto}.tart .k{fill:var(--col)}.tart .d{fill:color-mix(in srgb,var(--col) 66%,#000)}.tart .l{fill:color-mix(in srgb,var(--col) 50%,#fff)}
.tl-title{position:absolute;left:6px;right:6px;bottom:40px;display:flex;flex-direction:column;align-items:center;font:400 30px/.95 'Bebas Neue',Impact,'Haettenschweiler','Arial Narrow',sans-serif;letter-spacing:.01em;text-transform:uppercase;-webkit-text-stroke:.8px #fff;text-shadow:0 2px 14px rgba(0,0,50,.8)}.tl-title span{display:block;white-space:nowrap}
.tl-btn{white-space:nowrap;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#1c63e6;color:#fff;font:700 12px Inter,sans-serif;letter-spacing:.05em;padding:5px 16px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tl-edit{position:absolute;top:8px;right:8px;padding:4px 10px;font:600 12px Inter,sans-serif;color:#fff;background:rgba(0,0,40,.6);border:1px solid rgba(255,255,255,.3);border-radius:14px;cursor:pointer;opacity:0;transition:opacity .15s}
.tile:hover .tl-edit,.tl-edit:focus-visible{opacity:1}@media(hover:none){.tl-edit{opacity:1}}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,1fr);gap:10px}.tl-btn{font-size:10px;padding:3px 12px;bottom:8px}.tl-title{bottom:30px}.sec{font-size:18px}}

.step{display:inline-flex;align-items:center;gap:8px}.step.wide{flex:1;justify-content:space-between}.pb .row .step .b{flex:0 0 34px}.step button{width:34px;height:34px;padding:0;font-size:18px;line-height:1}.step b{min-width:22px;text-align:center}
.seg{display:inline-flex}.seg button{border-radius:0;padding:0 12px;height:36px}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.th{width:58px;height:58px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--pan2);cursor:pointer;flex:none}.th img{width:100%;height:100%;object-fit:cover;display:block}
.big{width:100%;max-height:58vh;object-fit:contain;border-radius:8px;background:#000}
/* hover: things lift and catch the light when the mouse touches them */
.pc,.tile,.kpi,.tk,.chip,button.b,nav button,.th{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease,filter .18s ease}
.pc .pi::after,.tile::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.3) 50%,transparent 62%);transform:translateX(-135%)}
@media(hover:hover){
 .pc:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(0,0,0,.42);border-color:var(--acc)}
 .pc:hover .pi::after,.tile:hover::after{transform:translateX(135%);transition:transform .8s ease}
 .tile:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 14px 32px rgba(37,99,235,.4)}
 .kpi:hover,.tk:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.3)}
 button.b:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.14);box-shadow:0 6px 18px rgba(59,130,246,.38)}
 button.b:not(:disabled):active{transform:scale(.96)}
 .chip:hover{transform:translateY(-2px);border-color:var(--acc)}
 nav button:hover{transform:translateX(4px)}
 .th:hover{transform:scale(1.07)}
 tr:hover td{background:color-mix(in srgb,var(--acc) 9%,transparent)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.pc:hover,.tile:hover,.kpi:hover,.tk:hover,nav button:hover{transform:none!important}.pc .pi::after,.tile::after{display:none}}
input[type=file]{font-size:13px;color:var(--mute)}input[type=file]::file-selector-button{background:var(--pan2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;margin-right:8px;cursor:pointer;font:600 12px Inter,sans-serif}
</style></head><body>

const getT=()=>{try{return localStorage.t||sessionStorage.t||MEM}catch(e){return MEM}};

let BASE=null;/* where app.py lives; found automatically, so the page also works if opened from another local server or a file */
async function api(m,u,b){let r,j;
 for(const base of BASE!==null?[BASE]:(location.protocol=='file:'?[]:['']).concat(['http://localhost:8000','http://127.0.0.1:8000'])){
  try{const x=await fetch(base+u,{method:m,headers:{'Content-Type':'application/json','X-Token':getT()},body:b?JSON.stringify(b):undefined});j=JSON.parse(await x.text());r=x;BASE=base;break}catch(e){}}
 if(!r){BASE=null;throw Error('Cannot reach the shop server. Start it first: double-click start.bat (or run "python app.py"), then try again.')}
 if(r.status==401&&u!='/api/login'){clearT();loginView()}
 if(!r.ok)throw Error(j.error||'Request failed');return j}
function loginView(mode='login',key=''){document.body.classList.add('login');

 const V={
 login:`<form id="login"><input class="sr" name="username" value="admin" autocomplete="username" tabindex="-1" aria-hidden="true">${pwField('password','Password','current-password',1)}
  <div class="opts"><label><input type="checkbox" name="remember" ${LS('remember')!='0'?'checked':''}> Remember me</label><button type="button" class="link" data-go="forgot">Forgot password?</button></div>
  <button class="b">Sign in</button></form>`,
 forgot:`<h2>Reset your password</h2><p>Enter the recovery key that was shown when the system first started. Lost it? On the shop computer, run <b>python app.py reset-password</b>.</p>
  <form id="forgot"><label>Recovery key<input name="key" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" required autofocus></label>
  ${pwField('password','New password','new-password')}${pwField('password2','Repeat new password','new-password')}
  <button class="b">Reset password</button><button type="button" class="link" data-go="login">Back to sign in</button></form>`,

  <div class="key" id="newkey">${esc(key)}</div><div class="row" style="margin-top:12px"><button class="b" data-go="login">Go to sign in</button><button class="b ghost" type="button" data-copy="${esc(key)}">Copy key</button></div>`};

const ago=s=>{const m=(Date.now()-new Date(s.replace(' ','T')+'Z'))/6e4;return m<1?'just now':m<60?Math.floor(m)+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'};

function lineChart(labels,series){const W=640,H=230,L=48,R=12,T=10,B=26,n=labels.length,mx=Math.max(1000,...series.flatMap(s=>s.v)),p=10**Math.floor(Math.log10(mx)),nm=[1,2,4,8,10].map(k=>k*p).find(v=>v>=mx),x=i=>L+i*(W-L-R)/(n-1),y=v=>T+(H-T-B)*(1-v/nm),f=v=>v>=1000?(v/1000)+'K':v;let g='';
 for(let k=0;k<=4;k++){const v=nm*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${f(Math.round(v))}</text>`}
 labels.forEach((d,i)=>{if(i%5==0||i==n-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i==n-1?'end':'middle'}">${d.slice(5)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="Sales, cost and profit for the last 30 days">${g}${series.map(s=>{const pt=s.v.map((v,i)=>`${x(i)},${y(v)}`).join(' L');return `<path d="M${pt} L${x(n-1)},${y(0)} L${x(0)},${y(0)}Z" style="fill:var(--${s.c});opacity:.12"/><path d="M${pt}" style="fill:none;stroke:var(--${s.c});stroke-width:2"/>`}).join('')}</svg>`}
function barChart(cs){if(!cs.length)return '<p style="color:var(--mute)">No products yet.</p>';const W=420,H=230,L=34,B=34,T=18,mx=Math.max(5,...cs.map(c=>c.units)),nm=Math.ceil(mx/5)*5,step=(W-L-10)/cs.length,bw=Math.min(54,step*.6),cl=['c1','c3','c4','c5','c2'];let g='';
 for(let k=0;k<=4;k++){const yy=T+(H-T-B)*(1-k/4);g+=`<line x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}" class="gl"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${Math.round(nm*k/4)}</text>`}
 cs.forEach((c,i)=>{const h=(H-T-B)*c.units/nm,cx=L+step*i+step/2;g+=`<rect x="${cx-bw/2}" y="${H-B-h}" width="${bw}" height="${h}" rx="3" style="fill:var(--${cl[i%5]})"/><text x="${cx}" y="${H-B-h-4}" text-anchor="middle">${c.units}</text><text x="${cx}" y="${H-B+16}" text-anchor="middle">${esc(LABEL[c.category]||c.category)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="Units sold per category">${g}</svg>`}

async function shrink(file,max=640){const url=URL.createObjectURL(file);
 try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(Error('That file is not an image the browser can read. Try a JPG or PNG.'));i.src=url});
  const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
 finally{URL.revokeObjectURL(url)}}

 'أزرق':'#2563eb','أحمر':'#dc2626','احمر':'#dc2626','أسود':'#262b35','اسود':'#262b35','أبيض':'#eef0f4','ابيض':'#eef0f4','أخضر':'#16a34a','اخضر':'#16a34a','وردي':'#ec4899','بنفسجي':'#7c3aed','فضي':'#a3a9b5','ذهبي':'#d4a017','برتقالي':'#f97316','أصفر':'#eab308','اصفر':'#eab308','رمادي':'#6b7280'};
const CKEYS=Object.keys(COLORS).sort((a,b)=>b.length-a.length);
function colorOf(p){/* the Color box wins, then a colour word inside the name */
 const raw=(p.color||'').trim(),find=t=>CKEYS.find(k=>/^[a-z ]+$/.test(k)?new RegExp('(^|[^a-z])'+k+'($|[^a-z])').test(t):t.includes(k));
 if(/^#[0-9a-f]{3,8}$/i.test(raw))return{hex:raw,name:raw};
 for(const t of [raw.toLowerCase(),String(p.name||'').toLowerCase()]){const k=t&&find(t);if(k)return{hex:COLORS[k],name:k}}
 if(raw.length>2&&window.CSS&&CSS.supports('color',raw)&&!/^(inherit|initial|unset|transparent|currentcolor)$/i.test(raw))return{hex:raw,name:raw};
 return null}

 $('#nav').innerHTML=Object.entries(TABS).map(([k,[v,i]])=>`<button data-t="${k}" ${S.tab==k?'aria-current="page"':''}>${ico(i)}${v}${k=='inventory'&&S.sum.low_stock.length?`<span class="pill">${S.sum.low_stock.length}</span>`:''}</button>`).join('');
 $('#view').innerHTML=`<h1 class="pt">${TABS[S.tab][0]}</h1>`+VIEWS[S.tab]()}
const catSel=()=>`<select id="catf" aria-label="Filter by category"><option value="">All categories</option>${[...new Set(S.products.map(p=>p.category))].map(c=>`<option ${S.cat==c?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
const VIEWS={
overview(){const D=S.dash,T=D.totals;
 return `<div class="kpis">${[['Total sales',kmoney(T.revenue||0),'c1','chart'],['Orders completed',T.orders||0,'c4','cart'],['Total products',S.products.length,'c5','box'],['Average order value',money(T.avg||0),'c3','grid']].map(([a,b,c,i])=>`<div class="kpi"><div class="ic" style="background:color-mix(in srgb,var(--${c}) 18%,transparent);color:var(--${c})">${ico(i)}</div><div><small>${a}</small><b>${b}</b></div></div>`).join('')}</div>
 <div class="two"><section class="pan"><h3>Sales vs cost (last 30 days)</h3><div class="leg"><span><i style="background:var(--c1)"></i>Sales</span><span><i style="background:var(--c2)"></i>Cost of goods</span><span><i style="background:var(--c3)"></i>Profit</span></div>${lineChart(D.days,[{v:D.sales,c:'c1'},{v:D.cost,c:'c2'},{v:D.profit,c:'c3'}])}</section>
 <section class="pan"><h3>Top selling by category (units)</h3>${barChart(D.categories)}</section></div>
 <div class="two"><section class="pan wrap"><div class="ph"><h3>Product list (stock status)</h3>${catSel()}</div><table><tr><th>Product<th>SKU<th>Category<th>Price<th>Stock level</tr>${fp().map(p=>`<tr><td>${esc(p.name)}<td class="num">${esc(p.sku)}<td>${esc(p.category)}<td class="num">${money(p.price)}<td>${lvl(p)}`).join('')||'<tr><td colspan=5>No products found.'}</table></section>
 <section class="pan"><h3>Recent activity</h3>${D.activity.map(a=>`<div class="fd"><i class="dot ${a.kind}"></i><div>${esc(a.text)}<small>${ago(a.at)}</small></div></div>`).join('')||'<p style="color:var(--mute)">Nothing yet. Sales and repairs will show here.</p>'}</section></div>`},
shop(){const P=S.products,T=tiles();
 if(!P.length)return `${T}<div class="pan empty"><h3>Your shop is empty</h3><p>Add your first product: type its name, choose a color and add a photo. Without a photo, the shop draws the item in that color for you.</p><button class="b" data-new>Add product</button></div>`;
 const cats=[...new Set(P.map(p=>p.category))],
 chips=[['','All',P.length],['__new','New',P.filter(isNew).length],...cats.map(c=>[c,LABEL[c]||c,P.filter(p=>p.category==c).length])];
 if(S.shopCat&&!CATS.includes(S.shopCat)&&!chips.some(c=>c[0]==S.shopCat))S.shopCat='';
 const list=fp(S.shopCat),it=Object.entries(S.cart).filter(([,q])=>q>0),n=it.reduce((a,[,q])=>a+q,0),t=it.reduce((a,[id,q])=>a+q*S.products.find(p=>p.id==id).price,0),
 demo=P.some(p=>DEMO.includes(p.sku));
 return `${T}${demo?'<div class="pan note"><span>The shop still has the sample products that came with the system.</span><button class="b ghost" data-cleardemo>Remove sample products</button></div>':''}
 <div class="bar"><div class="chips">${chips.map(([v,l,c])=>`<button class="chip" data-chip="${esc(v)}" ${S.shopCat==v?'aria-pressed="true"':''}>${esc(l)}<small>${c}</small></button>`).join('')}</div><button class="b" data-new>Add product</button></div>
 ${!P.some(p=>p.image)?'<p style="color:var(--mute);margin:-6px 0 14px">Items without a photo are drawn in their color. Press <b>Edit</b> on an item to add its real photo.</p>':''}
 <div class="shop">${list.map(p=>{const src=imgSrc(p),col=colorOf(p);return `<article class="pc ${p.stock?'':'so'}"><div class="pi" style="--col:${artHex(p)}">${art(p)}${src?`<img src="${esc(src)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">`:''}${isNew(p)?'<span class="bd new">New</span>':''}${p.stock<1?'<span class="bd out">Sold out</span>':p.stock<=p.low_stock?`<span class="bd low">Only ${p.stock} left</span>`:''}</div>
  <div class="pb"><small>${esc(LABEL[p.category]||p.category)}${col?`<i class="sw" style="background:${col.hex}"></i><span style="text-transform:capitalize">${esc(col.name)}</span>`:''}</small><div class="pn">${esc(p.name)}</div><div class="pp num">${money(p.price)}</div>
  <div class="row">${(S.cart[p.id]||0)?stepper(p,S.cart[p.id],1):`<button class="b" style="flex:1" data-add="${p.id}" ${p.stock?'':'disabled'}>Add to sale</button>`}<button class="b ghost" data-edit="${p.id}" aria-label="Edit ${esc(p.name)}">Edit</button></div></div></article>`}).join('')||'<p style="color:var(--mute)">No products here yet.</p>'}</div>
 ${n?`<div class="cartbar"><span><b>${n}</b> item${n>1?'s':''}, <b class="num">${money(t)}</b></span><button class="b" data-t="sales">Go to checkout</button></div>`:''}`},
sales(){const items=Object.entries(S.cart).filter(([,q])=>q>0),sub=cartSub(),dsc=discOf(sub);
 return `<div class="two"><section class="pan wrap"><div class="ph"><h3>Products</h3>${catSel()}</div><table><tr><th>Item<th>Price<th>Quantity</tr>${fp().map(p=>`<tr><td>${esc(p.name)}<td class="num">${money(p.price)}<td>${p.stock?stepper(p,S.cart[p.id]||0):'<span class="low">Sold out</span>'}`).join('')||'<tr><td colspan=3>No products found.'}</table></section>
 <section class="pan"><h3>Current sale</h3>${items.length?items.map(([id,q])=>{const p=S.products.find(x=>x.id==id);return `<div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${esc(p.name)}</span>${stepper(p,q)}</div>`}).join(''):'<p style="color:var(--mute)">Add products from the list to start a sale.</p>'}
 <form id="sale" style="margin-top:12px"><label>Customer (ID must be checked)<select name="customer_id" required><option value="">Choose customer</option>${S.customers.map(c=>`<option value="${c.id}" ${c.id_checked?'':'disabled'} ${S.cust==c.id?'selected':''}>${esc(c.name)}${c.id_checked?'':' (ID not checked)'}</option>`).join('')}</select></label>
 <label>Discount<span class="row"><input id="disc" name="disc" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" value="${esc(S.disc.v)}" style="flex:1;min-width:0"><span class="seg"><button type="button" class="b ${S.disc.pct?'ghost':''}" data-dmode="amt" aria-pressed="${!S.disc.pct}">L.E.</button><button type="button" class="b ${S.disc.pct?'':'ghost'}" data-dmode="pct" aria-pressed="${S.disc.pct}">%</button></span></span></label>
 <div class="row" style="justify-content:space-between;color:var(--mute)"><span>Subtotal</span><span class="num" id="subv">${money(sub)}</span></div>
 <div class="row" style="justify-content:space-between;color:var(--mute)"><span>Discount</span><span class="num" id="dscv">${dsc?'−':''}${money(dsc)}</span></div>
 <div class="row" style="justify-content:space-between"><b>Total</b><b class="num" id="totv">${money(sub-dsc)}</b></div><button class="b" ${items.length?'':'disabled'}>Complete sale</button></form></section></div>
 <section class="pan wrap"><h3>Recent sales</h3><table><tr><th>#<th>When<th>Customer<th>Items<th>Discount<th>Total</tr>${S.sales.slice(0,10).map(s=>`<tr><td>${s.id}<td>${when(s.created_at)}<td>${esc(s.customer)}<td>${esc(s.items)}<td class="num">${s.discount>0?money(s.discount):'-'}<td class="num">${money(s.total)}`).join('')||'<tr><td colspan=6>No sales yet.'}</table></section>`},
repairs(){return `<section class="pan" style="margin-bottom:14px"><h3>Book in a device</h3><form id="repair" class="row" style="flex-wrap:wrap"><select name="customer_id" required><option value="">Customer</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
 <input name="device" placeholder="Device (e.g. Box mod 100W)" required style="flex:1;min-width:200px"><input name="issue" placeholder="What's wrong?" required style="flex:1;min-width:180px"><input name="quote" type="number" step="0.01" min="0" placeholder="Quote L.E." style="width:110px">
 <input name="photo" type="file" accept="image/*" title="Photo of the device (optional)" aria-label="Photo of the device (optional)" style="width:230px"><button class="b">Book in</button></form></section>
 <div class="board">${[['received','Received'],['completed','Completed']].map(([s,l])=>{const t=S.repairs.filter(r=>r.status==s);return `<div class="col" data-s="${s}"><h3>${l}<span class="num">${t.length}</span></h3>${t.map(r=>{const u=src2(r.photo);return `<div class="tk"><div class="row" style="align-items:flex-start;gap:10px">${u?`<button type="button" class="th" data-rphoto="${r.id}" aria-label="View photo of ${esc(r.device)}"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()"></button>`:''}<div style="flex:1;min-width:0"><b>${esc(r.device)}</b><small>${esc(r.issue)}</small><small>${esc(r.customer)} · ${money(r.quote)}</small>${s=='completed'?`<small>Completed ${when(r.updated_at)}</small>`:''}</div></div>
  <div class="row" style="margin-top:8px;flex-wrap:wrap">${s=='received'?`<button type="button" class="b" data-done="${r.id}">Mark completed</button>`:`<button type="button" class="b ghost" data-reopen="${r.id}">Move back</button>`}<button type="button" class="b ghost" data-rphoto="${r.id}">${u?'Photo':'Add photo'}</button></div></div>`}).join('')||'<p style="color:var(--mute);margin:6px 4px">Nothing here.</p>'}</div>`}).join('')}</div>`},
customers(){return `<div class="two"><section class="pan wrap"><h3>Customers</h3><table><tr><th>Name<th>Phone<th>ID</tr>${S.customers.map(c=>`<tr><td>${esc(c.name)}<td>${esc(c.phone)}<td>${c.id_checked?'Checked':'<b class="low">Not checked</b>'}`).join('')||'<tr><td colspan=3>No customers yet.'}</table></section>
 <section class="pan"><h3>New customer</h3><p style="color:var(--mute);margin:0 0 8px">Look at the customer's photo ID, then tick the box. A sale cannot be completed until it is ticked.</p><form id="customer"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label><label class="row"><input name="id_checked" type="checkbox"> I checked photo ID</label><button class="b">Save customer</button></form></section></div>`},
inventory(){return `<div class="two"><section class="pan wrap"><div class="ph"><h3>Inventory</h3>${catSel()}</div><table><tr><th>Name<th>Category<th>In stock<th>Add stock</tr>${fp().map(p=>`<tr><td>${esc(p.name)}<td>${esc(p.category)}<td>${lvl(p)}<td><form class="row restock" data-id="${p.id}"><input name="add" type="number" value="0" style="width:80px" aria-label="Add stock for ${esc(p.name)}"><button class="b ghost">Save</button></form>`).join('')}</table></section>
 <section class="pan"><h3>Add an item</h3><p style="color:var(--mute);margin:0 0 12px">Add a new product with its color and photo. Stock for existing items is added in the table.</p><button class="b" data-new>Add product</button></section></div>`},
report(){const R=S.report,T=R.totals;return `<section class="pan" style="margin-bottom:14px"><form id="range" class="row" style="flex-wrap:wrap"><label>From<input type="date" name="from" value="${S.rng.from||''}"></label><label>To<input type="date" name="to" value="${S.rng.to||''}"></label><button class="b">Show</button></form></section>
 <div class="kpis">${[['Items sold',T.sold],['Revenue',money(T.revenue||0)],['Profit',money(T.profit||0)],['Stock value at cost',money(T.stock_value||0)]].map(([a,b])=>`<div class="kpi"><div><small>${a}</small><b>${b}</b></div></div>`).join('')}</div>
 <div class="two"><section class="pan wrap"><h3>Sold per product</h3><table><tr><th>Product<th>Sold<th>Revenue<th>Profit<th>Left</tr>${R.items.map(r=>`<tr><td>${esc(r.name)}<td class="num">${r.sold}<td class="num">${money(r.revenue)}<td class="num">${money(r.profit)}<td class="num">${r.stock}`).join('')}<tr><th>Total<th class="num">${T.sold}<th class="num">${money(T.revenue||0)}<th class="num">${money(T.profit||0)}<th class="num">${T.stock_units}</tr></table></section>
 <section class="pan wrap"><h3>By category</h3><table><tr><th>Category<th>Sold<th>Revenue</tr>${R.categories.map(r=>`<tr><td>${esc(r.category)}<td class="num">${r.sold}<td class="num">${money(r.revenue)}`).join('')}</table></section></div>`}};
document.addEventListener('click',e=>{if(e.target.classList.contains('ov'))return closeModal();const t=e.target.closest('button');if(!t)return;
 if(t.dataset.t){S.tab=t.dataset.t;render()}
 if(t.dataset.add){const p=S.products.find(x=>x.id==t.dataset.add),n=S.cart[p.id]||0;if(n<p.stock){S.cart[p.id]=n+1;render()}else toast('Only '+p.stock+' in stock',1)}
 if(t.dataset.chip!==undefined){S.shopCat=t.dataset.chip;render()}
 if(t.dataset.edit)productView(S.products.find(p=>p.id==t.dataset.edit));
 if(t.dataset.new!==undefined)productView();
 if(t.dataset.tile!==undefined){S.shopCat=S.shopCat==t.dataset.tile?'':t.dataset.tile;render();const b=document.querySelector('.bar,.empty');if(b)b.scrollIntoView({behavior:'smooth',block:'start'})}
 if(t.dataset.tilepic)tileView(t.dataset.tilepic);
 if(t.dataset.del&&confirm('Delete this product? This cannot be undone.'))act(async()=>{await api('DELETE','/api/products/'+t.dataset.del);closeModal()},'Product deleted');
 if(t.dataset.cleardemo!==undefined&&confirm('Remove the sample products? Products that were already sold stay.'))act(async()=>{const r=await api('POST','/api/products/clear-demo');toast(r.deleted+' sample product'+(r.deleted==1?'':'s')+' removed')});
 if(t.dataset.close!==undefined)closeModal();
 if(t.dataset.sub){S.cart[t.dataset.sub]=Math.max(0,(S.cart[t.dataset.sub]||0)-1);render()}
 if(t.dataset.dmode){S.disc.pct=t.dataset.dmode=='pct';render()}
 if(t.dataset.done)act(()=>api('PUT','/api/repairs/'+t.dataset.done,{status:'completed'}),'Repair marked completed');
 if(t.dataset.reopen)act(()=>api('PUT','/api/repairs/'+t.dataset.reopen,{status:'received'}),'Moved back to received');
 if(t.dataset.rphoto)repairPhotoView(S.repairs.find(r=>r.id==t.dataset.rphoto));
 if(t.id=='theme')theme(document.documentElement.dataset.theme=='light'?'dark':'light');
 if(t.id=='out'){api('POST','/api/logout').catch(()=>{});clearT();loginView()}
 if(t.dataset.go)loginView(t.dataset.go);
 if(t.dataset.eye!==undefined){const i=t.previousElementSibling,show=i.type=='password';i.type=show?'text':'password';t.textContent=show?'Hide':'Show'}
 if(t.dataset.copy){navigator.clipboard?.writeText(t.dataset.copy).then(()=>toast('Recovery key copied'),()=>toast('Select the key and copy it by hand',1))}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('#pform'),a=$('#artpv');if(!f||!a)return;const d=Object.fromEntries(new FormData(f)),q={name:d.name||'',color:d.color||'',category:d.category};a.style.setProperty('--col',artHex(q));a.innerHTML=art(q)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.type=='file'){const pv=t.closest('form').querySelector('.pv'),f=t.files[0],a=$('#artpv');if(pv&&f){pv.src=URL.createObjectURL(f);pv.hidden=false}if(a)a.hidden=!!f}
 if(t.name=='rmphoto'){const a=$('#artpv'),v=t.closest('form').querySelector('.pv');if(a)a.hidden=!t.checked;if(v)v.hidden=t.checked}
 if(t.form&&t.form.id=='sale'&&t.name=='customer_id')S.cust=t.value;if(t.id=='catf'){S.cat=t.value;render()}});
document.addEventListener('input',e=>{if(e.target.id=='disc'){S.disc.v=e.target.value;const sub=cartSub(),d=discOf(sub);$('#subv').textContent=money(sub);$('#dscv').textContent=(d?'−':'')+money(d);$('#totv').textContent=money(sub-d)}});
$('#q').addEventListener('input',e=>{S.find=e.target.value.trim().toLowerCase();if(getT()&&['overview','shop','sales','inventory'].includes(S.tab))render()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.id=='sale')act(async()=>{const v=parseFloat(S.disc.v)||0,r=await api('POST','/api/sales',{customer_id:+d.customer_id,items:Object.entries(S.cart).filter(([,q])=>q>0).map(([id,q])=>({product_id:+id,qty:q})),discount:S.disc.pct?0:v,discount_percent:S.disc.pct?v:0});S.cart={};S.cust='';S.disc={v:'',pct:false};toast('Sale complete: '+money(r.total)+(r.discount?' (discount '+money(r.discount)+')':''))});
 if(f.id=='repair')act(async()=>{const p={...d};delete p.photo;if(d.photo&&d.photo.size)p.photo=await shrink(d.photo,800);await api('POST','/api/repairs',p)},'Device booked in');
 if(f.id=='rphoto')act(async()=>{const p={};if(d.photo&&d.photo.size)p.photo=await shrink(d.photo,800);else if(d.rmphoto)p.photo='';if('photo' in p)await api('PUT','/api/repairs/'+f.dataset.id,p);closeModal()},'Photo saved');
 if(f.id=='pform')act(async()=>{const id=f.dataset.id,p={name:d.name,color:d.color.trim(),category:d.category,price:d.price,cost:d.cost};
  if(d.photo&&d.photo.size)p.image=await shrink(d.photo);else if(d.rmphoto)p.image='';
  if(id)await api('PUT','/api/products/'+id,p);else{p.sku=d.sku;p.stock=d.stock;await api('POST','/api/products',p)}closeModal()},f.dataset.id?'Product updated':'Product added');
 if(f.id=='tpic')act(async()=>{let img=null;if(d.photo&&d.photo.size)img=await shrink(d.photo,900);else if(d.rmphoto)img='';
  if(img!==null)await api('PUT','/api/catimage',{category:f.dataset.cat,image:img});closeModal()},'Picture saved');
 if(f.id=='login'){LSset('remember',d.remember?'1':'0');act(async()=>{const r=await api('POST','/api/login',{password:d.password,remember:!!d.remember});setT(r.token,!!d.remember)})}
 if(f.id=='forgot'){if(d.password!==d.password2)return toast('The two passwords do not match',1);
  (async()=>{try{const r=await api('POST','/api/forgot',{key:d.key,password:d.password});loginView('done',r.recovery_key)}catch(e){toast(e.message,1)}})()}
 if(f.id=='range'){S.rng=d;S.q='?from='+d.from+'&to='+d.to;act(async()=>{},'Report updated')}
 if(f.id=='customer'){d.id_checked=!!d.id_checked;act(()=>api('POST','/api/customers',d),'Customer saved')}
 if(f.classList.contains('restock'))act(()=>api('PUT','/api/products/'+f.dataset.id,{add:+d.add}),'Stock updated')});
(async()=>{if(!getT())return loginView();try{await load()}catch(e){loginView();if(getT())toast(e.message,1)}})();
</script></body></html>
